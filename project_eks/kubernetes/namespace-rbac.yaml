# ServiceAccount for EKS Pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: virusprotect
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/virusprotect-eks-pod-execution
---
apiVersion: v1
kind: Namespace
metadata:
  name: virusprotect
  labels:
    name: virusprotect
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: virusprotect
spec:
  hard:
    requests.cpu: "100"
    requests.memory: "200Gi"
    limits.cpu: "200"
    limits.memory: "400Gi"
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: virusprotect
spec:
  limits:
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scan-api-pdb
  namespace: virusprotect
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: scan-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scan-worker-pdb
  namespace: virusprotect
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: scan-worker
